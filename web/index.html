<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Sign and edit PDFs in your browser. Nothing leaves your device." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>pdf-flex</title>
    <!-- The saved theme (see src/theme.ts), applied before the first paint. -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("pdf-flex:dark-mode") === "on" ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
