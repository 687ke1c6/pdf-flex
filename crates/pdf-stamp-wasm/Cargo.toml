[package]
name = "pdf-stamp-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for pdf-stamp"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf-stamp = { path = "../pdf-stamp", features = ["serde"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2"
