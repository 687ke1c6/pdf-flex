[package]
name = "pdf-stamp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Stamp a signature image onto PDF pages"

[dependencies]
lopdf = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Deserialize placements (used by the WASM bindings)
serde = ["dep:serde"]

# lopdf depends on getrandom, which needs its browser backend on wasm32
[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.45", default-features = false, features = ["wasm_js"] }
