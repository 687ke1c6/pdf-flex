[package]
name = "pdf-sign-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Static file server for the pdf-sign web app: security headers, caching, compression"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
